
name: Render Riddle Town Video

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Choose episode
        type: choice
        options:
          - '1'
          - '2'
        default: '1'
        required: true

      style:
        description: Choose video style
        type: choice
        options:
          - story
          - neon
          - hybrid
        default: hybrid
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Blender, FFmpeg and narration
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg espeak-ng fonts-dejavu-core

      - name: Check dependencies
        run: |
          node --version
          npm --version
          blender --version
          ffmpeg -version
          espeak-ng --version

      - name: Install project
        run: npm install

      - name: Render original story video
        run: npm run render -- "${{ inputs.episode }}" "${{ inputs.style }}"

      - name: Render 3D Blender animation
        run: |
          mkdir -p out
          blender --background --factory-startup --python-exit-code 1 --python src/blender_scene.py

      - name: Verify generated videos
        run: |
          test -f out/riddle-town-3d-test.mp4
          test -n "$(find out -maxdepth 1 -name '*.mp4' -print -quit)"
          ls -lh out/*.mp4

      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: riddle-town-videos
          path: out/*.mp4
          if-no-files-found: error
          retention-days: 14
          
