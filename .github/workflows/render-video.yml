
name: Render Riddle Town Video

on:
  workflow_dispatch:
    inputs:
      episode:
        description: Choose episode
        type: choice
        options:
          - '1'
          - '2'
        default: '1'
      style:
        description: Choose video style
        type: choice
        options:
          - story
          - neon
        default: story

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg and narration
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Install project
        run: npm install

      - name: Render video
        run: npm run render -- "${{ inputs.episode }}" "${{ inputs.style }}"

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: riddle-town-video
          path: out/*.mp4
          retention-days: 14
          
